</style></head><body><header><strong>STUCKLEVEL75</strong><a href="/#businesses">← Back to Businesses</a></header><main><section class="hero" id="hero"><div class="label" id="status">GTA RP Business</div><h1 id="name"></h1><p id="description" class="muted"></p></section><p id="announcement" class="product" hidden></p><h2>About the Business</h2><p id="details" class="muted"></p><h2>What We Offer</h2><div id="products" class="products"></div><section id="hiring" hidden><h2 id="application-title">Join Our Team</h2><p id="application-intro" class="muted"></p><p id="hiring-status" class="muted"></p><form id="application-form" class="product"><label for="app-name">Character name</label><input id="app-name" required maxlength="80" minlength="2"><label for="app-contact">Discord username / contact</label><input id="app-contact" required maxlength="120" minlength="3"><label for="app-experience">Past experience</label><textarea id="app-experience" maxlength="1200"></textarea><label for="app-reason">Why do you want to work here?</label><textarea id="app-reason" required minlength="10" maxlength="1200"></textarea><label for="app-availability">Availability</label><textarea id="app-availability" maxlength="500"></textarea><div id="application-extra-fields"></div><div style="position:absolute;left:-10000px" aria-hidden="true"><label for="app-website">Website</label><input id="app-website" tabindex="-1" autocomplete="off"></div><button type="submit">Submit Application</button></form><p class="muted">No account or sign-in required. One application per browser profile while hiring is open.</p></section></main><footer>© 2026 StuckLevel75</footer><script>const businesses={"digital-den":{name:"Remington's Digital Den",status:"Active Business",description:"Electronics, gear, scrap, coffee, donuts, and noodle cups.",details:"Your local stop for electronics, gear, scrap, and everyday essentials.",products:["Electronics","Gear","Scrap","Coffee & Donuts","Noodle Cups"]},"seans-donuts":{name:"Sean's Donuts",status:"Past Business",description:"A former GTA RP donut shop.",details:"A former GTA RP business and part of the StuckLevel75 story.",products:["Donuts","Coffee","Drinks"]}};const id=new URLSearchParams(location.search).get("id"),b=businesses[id];function display(b){if(!b){document.getElementById("name").textContent="Business not found";document.getElementById("description").textContent="Return to Businesses to browse profiles.";return}document.getElementById("products").replaceChildren();document.title=b.name+" | StuckLevel75";document.getElementById("name").textContent=b.name;document.getElementById("status").textContent=b.status;document.getElementById("description").textContent=b.description;document.getElementById("details").textContent=b.details;if(id==="seans-donuts")document.getElementById("hero").classList.add("past");for(const p of (b.showProducts===false?[]:b.products||[])){const e=document.createElement("div");e.className="product";e.textContent=p;document.getElementById("products").append(e)}const announcement=document.getElementById("announcement");announcement.textContent=b.showAnnouncement===false?"":b.announcement||"";announcement.hidden=!announcement.textContent}display(b);</script><script type="module">import{getApps,getApp,initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";import{getFirestore,doc,onSnapshot,collection,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";import{firebaseConfig}from"/firebase-config.js";const id=new URLSearchParams(location.search).get("id");const form=document.getElementById("application-form"),hiring=document.getElementById("hiring"),hiringStatus=document.getElementById("hiring-status");let hiringOpen=false,auth,db,extraQuestions=[];const defaults=["Character name","Discord username / contact","Past experience","Why do you want to work here?","Availability"];function renderQuestions(b){document.getElementById("application-title").textContent=b.applicationTitle||"Join Our Team";document.getElementById("application-intro").textContent=b.applicationIntro||"";["name","contact","experience","reason","availability"].forEach((key,i)=>{const input=document.getElementById("app-"+key);const label=form.querySelector('label[for="app-'+key+'"]');if(label)label.textContent=(b.applicationLabels?.[i]||"").trim()||defaults[i]});extraQuestions=Array.isArray(b.applicationExtra)?b.applicationExtra.filter(x=>typeof x==="string"&&x.trim()).slice(0,8):[];const root=document.getElementById("application-extra-fields");root.replaceChildren();extraQuestions.forEach((q,i)=>{const label=document.createElement("label");label.htmlFor="app-extra-"+i;label.textContent=q;const input=document.createElement("textarea");input.id="app-extra-"+i;input.maxLength=1200;input.required=true;root.append(label,input)})}form.addEventListener("submit",async e=>{e.preventDefault();if(!hiringOpen){hiringStatus.textContent="Applications are currently closed.";return}if(document.getElementById("app-website").value)return;try{hiringStatus.textContent="Submitting…";const user=auth.currentUser|| (await signInAnonymously(auth)).user;const data={businessId:id,applicantUid:user.uid,name:document.getElementById("app-name").value.trim(),contact:document.getElementById("app-contact").value.trim(),experience:document.getElementById("app-experience").value.trim(),reason:document.getElementById("app-reason").value.trim(),availability:document.getElementById("app-availability").value.trim(),extraAnswers:extraQuestions.map((question,i)=>({question,answer:document.getElementById("app-extra-"+i).value.trim()})),status:"pending",createdAt:serverTimestamp()};await setDoc(doc(db,"applications",id+"_"+user.uid),data);hiringStatus.textContent="Application submitted successfully.";form.reset()}catch(err){hiringStatus.textContent="Could not submit: "+err.message}});if(id&&firebaseConfig.projectId){const app=getApps().length?getApp():initializeApp(firebaseConfig);db=getFirestore(app);auth=getAuth(app);onSnapshot(doc(db,"businesses",id),snap=>{if(!snap.exists())return;const b=snap.data();renderQuestions(b);hiringOpen=b.hiringOpen===true&&b.status!=="past";hiring.hidden=!hiringOpen;hiringStatus.textContent=hiringOpen?"Applications are open. No account needed.":"";document.title=b.name+" | StuckLevel75";document.getElementById("name").textContent=b.name;document.getElementById("status").textContent=b.status==="past"?"Past Business":"Active Business";document.getElementById("description").textContent=b.description||"";document.getElementById("details").textContent=b.details||b.description||"";document.getElementById("hero").style.borderColor=b.color||"#714d8f";document.getElementById("products").replaceChildren();for(const p of (b.showProducts===false?[]:b.products||[])){const e=document.createElement("div");e.className="product";e.textContent=p;document.getElementById("products").append(e)}const announcement=document.getElementById("announcement");announcement.textContent=b.showAnnouncement===false?"":b.announcement||"";announcement.hidden=!announcement.textContent},err=>console.warn("Business unavailable",err.code))}</script></body></html>
