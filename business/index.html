<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Businesses | StuckLevel75</title><link rel="icon" href="/favicon.svg"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090e0b;color:#f5fff6;font:16px/1.6 Inter,Arial,sans-serif}a{color:#b3ffb6}header,main,footer{max-width:1050px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{color:#8fff98}main{padding-top:35px;min-height:70vh}.hero{border:1px solid #714d8f;background:linear-gradient(125deg,#352146,#15101d);padding:35px;border-radius:20px}.hero.past{border-color:#47604b;background:#17231a}.label{color:#d4a6ff;text-transform:uppercase;font-size:12px;letter-spacing:.15em;font-weight:800}h1{font-size:clamp(32px,6vw,62px);line-height:1.1;margin:10px 0}h2{margin-top:35px}.muted{color:#c6d0c7}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.product{padding:20px;background:#17231a;border:1px solid #34513b;border-radius:14px}form label{display:block;margin:12px 0 5px}form input,form textarea{display:block;width:100%;padding:12px;background:#0c120e;color:#fff;border:1px solid #4c6651;border-radius:8px;font:inherit}form button{background:#a56ce3;color:#fff;padding:12px 20px;border:0;border-radius:9px;font-weight:700;cursor:pointer;margin-top:15px}footer{color:#8ca18e;border-top:1px solid #29402e}@media(max-width:600px){header{flex-wrap:wrap}.hero{padding:22px}} .business-tabs{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}.business-tab{background:#20142d;color:#e8d7f6;border:1px solid #78509a;padding:13px 22px;border-radius:11px;font-weight:800;cursor:pointer}.business-tab[aria-selected="true"]{background:#9b59d0;color:white}.business-panel[hidden]{display:none!important}#hiring{margin-top:0}#hiring form{max-width:760px}@media(max-width:600px){.business-tab{flex:1}} .header-links{display:flex;align-items:center;gap:24px;flex-wrap:wrap}.header-links a{text-decoration:none;font-weight:700}.header-links a:hover{text-decoration:underline}@media(max-width:600px){.header-links{gap:14px}}</style></head><body><header><strong>STUCKLEVEL75</strong><nav class="header-links" aria-label="Site navigation"><a href="/">Home</a><a href="/#businesses">← Back to Businesses</a></nav></header><main><section class="hero" id="hero"><div class="label" id="status">GTA RP Business</div><h1 id="name"></h1><p id="description" class="muted"></p></section><nav class="business-tabs" role="tablist" aria-label="Business pages"><button class="business-tab" type="button" role="tab" id="tab-about" aria-controls="panel-about" aria-selected="true" data-tab="about">Storefront</button><button class="business-tab" type="button" role="tab" id="tab-apply" aria-controls="panel-apply" aria-selected="false" data-tab="apply" hidden>Job Application</button></nav><div class="business-panel" id="panel-about" role="tabpanel" aria-labelledby="tab-about"><p id="announcement" class="product" hidden></p><h2>About the Business</h2><p id="details" class="muted"></p><h2>Products & Services</h2><div id="products" class="products"></div></div><div class="business-panel" id="panel-apply" role="tabpanel" aria-labelledby="tab-apply" hidden><section id="hiring" hidden><h2 id="application-title">Join Our Team</h2><p id="application-intro" class="muted"></p><p id="hiring-status" class="muted"></p><form id="application-form" class="product"><label for="app-name">Character name</label><input id="app-name" required maxlength="80" minlength="2"><label for="app-contact">Discord username / contact</label><input id="app-contact" required maxlength="120" minlength="3"><label for="app-experience">Past experience</label><textarea id="app-experience" maxlength="1200"></textarea><label for="app-reason">Why do you want to work here?</label><textarea id="app-reason" required minlength="10" maxlength="1200"></textarea><label for="app-availability">Availability</label><textarea id="app-availability" maxlength="500"></textarea><div id="application-extra-fields"></div><div style="position:absolute;left:-10000px" aria-hidden="true"><label for="app-website">Website</label><input id="app-website" tabindex="-1" autocomplete="off"></div><button type="submit">Submit Application</button></form><p class="muted">No account or sign-in required. One application per browser profile while hiring is open.</p></section></div></main><footer>© 2026 StuckLevel75</footer><script>const businesses={"digital-den":{name:"Remington's Digital Den",status:"Active Business",description:"Electronics, gear, scrap, coffee, donuts, and noodle cups.",details:"Your local stop for electronics, gear, scrap, and everyday essentials.",products:["Electronics","Gear","Scrap","Coffee & Donuts","Noodle Cups"]},"seans-donuts":{name:"Sean's Donuts",status:"Past Business",description:"A former GTA RP donut shop.",details:"A former GTA RP business and part of the StuckLevel75 story.",products:["Donuts","Coffee","Drinks"]}};const id=new URLSearchParams(location.search).get("id"),b=businesses[id];function display(b){if(!b){document.getElementById("name").textContent="Business not found";document.getElementById("description").textContent="Return to Businesses to browse profiles.";return}document.getElementById("products").replaceChildren();document.title=b.name+" | StuckLevel75";document.getElementById("name").textContent=b.name;document.getElementById("status").textContent=b.status;document.getElementById("description").textContent=b.description;document.getElementById("details").textContent=b.details;if(id==="seans-donuts")document.getElementById("hero").classList.add("past");for(const p of (b.showProducts===false?[]:b.products||[])){const e=document.createElement("div");e.className="product";e.textContent=p;document.getElementById("products").append(e)}const announcement=document.getElementById("announcement");announcement.textContent=b.showAnnouncement===false?"":b.announcement||"";announcement.hidden=!announcement.textContent}display(b);</script><script type="module">import{getApps,getApp,initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,signInAnonymously}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";import{getFirestore,doc,onSnapshot,collection,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";import{firebaseConfig}from"/firebase-config.js";const id=new URLSearchParams(location.search).get("id");const form=document.getElementById("application-form"),hiring=document.getElementById("hiring"),hiringStatus=document.getElementById("hiring-status");let hiringOpen=false,auth,db,extraQuestions=[];function selectBusinessTab(tab){const apply=tab==="apply"&&!document.getElementById("tab-apply").hidden;for(const key of ["about","apply"]){const active=key===(apply?"apply":"about");document.getElementById("panel-"+key).hidden=!active;document.getElementById("tab-"+key).setAttribute("aria-selected",String(active))}}document.querySelectorAll("[data-tab]").forEach(button=>button.addEventListener("click",()=>{selectBusinessTab(button.dataset.tab);history.replaceState(null,"",button.dataset.tab==="apply"?location.pathname+location.search+"#apply":location.pathname+location.search)}));const defaults=["Character name","Discord username / contact","Past experience","Why do you want to work here?","Availability"];function renderQuestions(b){document.getElementById("application-title").textContent=b.applicationTitle||"Join Our Team";document.getElementById("application-intro").textContent=b.applicationIntro||"";["name","contact","experience","reason","availability"].forEach((key,i)=>{const input=document.getElementById("app-"+key);const label=form.querySelector('label[for="app-'+key+'"]');if(label)label.textContent=(b.applicationLabels?.[i]||"").trim()||defaults[i]});extraQuestions=Array.isArray(b.applicationExtra)?b.applicationExtra.filter(x=>typeof x==="string"&&x.trim()).slice(0,8):[];const root=document.getElementById("application-extra-fields");root.replaceChildren();extraQuestions.forEach((q,i)=>{const label=document.createElement("label");label.htmlFor="app-extra-"+i;label.textContent=q;const input=document.createElement("textarea");input.id="app-extra-"+i;input.maxLength=1200;input.required=true;root.append(label,input)})}form.addEventListener("submit",async e=>{e.preventDefault();if(!hiringOpen){hiringStatus.textContent="Applications are currently closed.";return}if(document.getElementById("app-website").value)return;try{hiringStatus.textContent="Submitting…";const user=auth.currentUser|| (await signInAnonymously(auth)).user;const data={businessId:id,applicantUid:user.uid,name:document.getElementById("app-name").value.trim(),contact:document.getElementById("app-contact").value.trim(),experience:document.getElementById("app-experience").value.trim(),reason:document.getElementById("app-reason").value.trim(),availability:document.getElementById("app-availability").value.trim(),extraAnswers:extraQuestions.map((question,i)=>({question,answer:document.getElementById("app-extra-"+i).value.trim()})),status:"pending",createdAt:serverTimestamp()};await setDoc(doc(db,"applications",id+"_"+user.uid),data);hiringStatus.textContent="Application submitted successfully.";form.reset()}catch(err){hiringStatus.textContent="Could not submit: "+err.message}});if(id&&firebaseConfig.projectId){const app=getApps().length?getApp():initializeApp(firebaseConfig);db=getFirestore(app);auth=getAuth(app);onSnapshot(doc(db,"businesses",id),snap=>{if(!snap.exists())return;const b=snap.data();renderQuestions(b);hiringOpen=b.hiringOpen===true&&b.status!=="past";hiring.hidden=!hiringOpen;document.getElementById("tab-apply").hidden=!hiringOpen;if(!hiringOpen)selectBusinessTab("about");else if(location.hash==="#apply")selectBusinessTab("apply");hiringStatus.textContent=hiringOpen?"Applications are open. No account needed.":"";document.title=b.name+" | StuckLevel75";document.getElementById("name").textContent=b.name;document.getElementById("status").textContent=b.status==="past"?"Past Business":"Active Business";document.getElementById("description").textContent=b.description||"";document.getElementById("details").textContent=b.details||b.description||"";document.getElementById("hero").style.borderColor=b.color||"#714d8f";document.getElementById("products").replaceChildren();for(const p of (b.showProducts===false?[]:b.products||[])){const e=document.createElement("div");e.className="product";e.textContent=p;document.getElementById("products").append(e)}const announcement=document.getElementById("announcement");announcement.textContent=b.showAnnouncement===false?"":b.announcement||"";announcement.hidden=!announcement.textContent},err=>console.warn("Business unavailable",err.code))}</script></body></html>
