<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Businesses | StuckLevel75</title><link rel="icon" href="/favicon.svg"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090e0b;color:#f5fff6;font:16px/1.6 Inter,Arial,sans-serif}a{color:#b3ffb6}header,main,footer{max-width:1050px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{color:#8fff98}main{padding-top:35px;min-height:70vh}.hero{border:1px solid #714d8f;background:linear-gradient(125deg,#352146,#15101d);padding:35px;border-radius:20px}.hero.past{border-color:#47604b;background:#17231a}.label{color:#d4a6ff;text-transform:uppercase;font-size:12px;letter-spacing:.15em;font-weight:800}h1{font-size:clamp(32px,6vw,62px);line-height:1.1;margin:10px 0}h2{margin-top:35px}.muted{color:#c6d0c7}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.product{padding:20px;background:#17231a;border:1px solid #34513b;border-radius:14px}form label{display:block;margin:12px 0 5px}form input,form textarea{display:block;width:100%;padding:12px;background:#0c120e;color:#fff;border:1px solid #4c6651;border-radius:8px;font:inherit}form button{background:#a56ce3;color:#fff;padding:12px 20px;border:0;border-radius:9px;font-weight:700;cursor:pointer;margin-top:15px}footer{color:#8ca18e;border-top:1px solid #29402e}@media(max-width:600px){header{flex-wrap:wrap}.hero{padding:22px}}</style></head><body><header><strong>STUCKLEVEL75</strong><a href="/#businesses">← Back to Businesses</a></header><main><section class="hero" id="hero"><div class="label" id="status">GTA RP Business</div><h1 id="name"></h1><p id="description" class="muted"></p></section><p id="announcement" class="product" hidden></p><h2>About the Business</h2><p id="details" class="muted"></p><h2>Products & Services</h2><div id="products" class="products"></div><section id="hiring" hidden><h2>Join Our Team</h2><p id="hiring-status" class="muted"></p><form id="application-form" class="product"><label for="app-name">Character name</label><input id="app-name" required maxlength="80" minlength="2"><label for="app-contact">Discord username / contact</label><input id="app-contact" required maxlength="120" minlength="3"><label for="app-experience">Past experience</label><textarea id="app-experience" maxlength="1200"></textarea><label for="app-reason">Why do you want to work here?</label><textarea id="app-reason" required minlength="10" maxlength="1200"></textarea><label for="app-availability">Availability</label><textarea id="app-availability" maxlength="500"></textarea><button type="submit">Submit Application</button></form><p class="muted">A signed-in website account is required to apply.</p></section></main><footer>© 2026 StuckLevel75</footer><script>const businesses={"digital-den":{name:"Remington's Digital Den",status:"Active Business",description:"Electronics, gear, scrap, coffee, donuts, and noodle cups.",details:"Your local stop for electronics, gear, scrap, and everyday essentials.",products:["Electronics","Gear","Scrap","Coffee & Donuts","Noodle Cups"]},"seans-donuts":{name:"Sean's Donuts",status:"Past Business",description:"A former GTA RP donut shop.",details:"A former GTA RP business and part of the StuckLevel75 story.",products:["Donuts","Coffee","Drinks"]}};const id=new URLSearchParams(location.search).get("id"),b=businesses[id];function display(b){if(!b){document.getElementById("name").textContent="Business not found";document.getElementById("description").textContent="Return to Businesses to browse profiles.";return}document.getElementById("products").replaceChildren();document.title=b.name+" | StuckLevel75";document.getElementById("name").textContent=b.name;document.getElementById("status").textContent=b.status;document.getElementById("description").textContent=b.description;document.getElementById("details").textContent=b.details;if(id==="seans-donuts")document.getElementById("hero").classList.add("past");for(const p of (b.showProducts===false?[]:b.products||[])){const e=document.createElement("div");e.className="product";e.textContent=p;document.getElementById("products").append(e)}const announcement=document.getElementById("announcement");announcement.textContent=b.showAnnouncement===false?"":b.announcement||"";announcement.hidden=!announcement.textContent}display(b);</script><script type="module">import{getApps,getApp,initializeApp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";import{getFirestore,doc,onSnapshot,collection,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";import{firebaseConfig}from"/firebase-config.js";const id=new URLSearchParams(location.search).get("id");const form=document.getElementById("application-form"),hiring=document.getElementById("hiring"),hiringStatus=document.getElementById("hiring-status");let hiringOpen=false,auth,db;form.addEventListener("submit",async e=>{e.preventDefault();if(!hiringOpen||!auth?.currentUser){hiringStatus.textContent="Please sign in to your website account before applying.";return}const data={businessId:id,applicantUid:auth.currentUser.uid,name:document.getElementById("app-name").value.trim(),contact:document.getElementById("app-contact").value.trim(),experience:document.getElementById("app-experience").value.trim(),reason:document.getElementById("app-reason").value.trim(),availability:document.getElementById("app-availability").value.trim(),status:"pending",createdAt:serverTimestamp()};try{hiringStatus.textContent="Submitting…";await addDoc(collection(db,"applications"),data);hiringStatus.textContent="Application submitted successfully.";form.reset()}catch(err){hiringStatus.textContent="Could not submit: "+err.message}});if(id&&firebaseConfig.projectId){const app=getApps().length?getApp():initializeApp(firebaseConfig);db=getFirestore(app);auth=getAuth(app);onAuthStateChanged(auth,user=>{if(hiringOpen)hiringStatus.textContent=user?"Applications are open.":"Sign in to your website account to apply."});onSnapshot(doc(db,"businesses",id),snap=>{if(!snap.exists())return;const b=snap.data();hiringOpen=b.hiringOpen===true&&b.status!=="past";hiring.hidden=!hiringOpen;hiringStatus.textContent=hiringOpen?(auth.currentUser?"Applications are open.":"Sign in to your website account to apply."):"";document.title=b.name+" | StuckLevel75";document.getElementById("name").textContent=b.name;document.getElementById("status").textContent=b.status==="past"?"Past Business":"Active Business";document.getElementById("description").textContent=b.description||"";document.getElementById("details").textContent=b.details||b.description||"";document.getElementById("hero").style.borderColor=b.color||"#714d8f";document.getElementById("products").replaceChildren();for(const p of (b.showProducts===false?[]:b.products||[])){const e=document.createElement("div");e.className="product";e.textContent=p;document.getElementById("products").append(e)}const announcement=document.getElementById("announcement");announcement.textContent=b.showAnnouncement===false?"":b.announcement||"";announcement.hidden=!announcement.textContent},err=>console.warn("Business unavailable",err.code))}</script></body></html>
