<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Businesses | StuckLevel75</title><link rel="icon" href="/favicon.svg"><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090e0b;color:#f5fff6;font:16px/1.6 Inter,Arial,sans-serif}a{color:#b3ffb6}header,main,footer{max-width:1050px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{color:#8fff98}main{padding-top:35px;min-height:70vh}.hero{border:1px solid #714d8f;background:linear-gradient(125deg,#352146,#15101d);padding:35px;border-radius:20px}.hero.past{border-color:#47604b;background:#17231a}.label{color:#d4a6ff;text-transform:uppercase;font-size:12px;letter-spacing:.15em;font-weight:800}h1{font-size:clamp(32px,6vw,62px);line-height:1.1;margin:10px 0}h2{margin-top:35px}.muted{color:#c6d0c7}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}.product{padding:20px;background:#17231a;border:1px solid #34513b;border-radius:14px}footer{color:#8ca18e;border-top:1px solid #29402e}@media(max-width:600px){header{flex-wrap:wrap}.hero{padding:22px}}</style></head><body><header><strong>STUCKLEVEL75</strong><a href="/#businesses">← Back to Businesses</a></header><main><section class="hero" id="hero"><div class="label" id="status">GTA RP Business</div><h1 id="name"></h1><p id="description" class="muted"></p></section><h2>About the Business</h2><p id="details" class="muted"></p><h2>Products & Services</h2><div id="products" class="products"></div><p class="muted" style="margin-top:35px">Job applications are planned for a future update.</p></main><footer>© 2026 StuckLevel75</footer><script>const businesses={"digital-den":{name:"Remington's Digital Den",status:"Active Business",description:"Electronics, gear, scrap, coffee, donuts, and noodle cups.",details:"Your local stop for electronics, gear, scrap, and everyday essentials.",products:["Electronics","Gear","Scrap","Coffee & Donuts","Noodle Cups"]},"seans-donuts":{name:"Sean's Donuts",status:"Past Business",description:"A former GTA RP donut shop.",details:"A former GTA RP business and part of the StuckLevel75 story.",products:["Donuts","Coffee","Drinks"]}};const id=new URLSearchParams(location.search).get("id"),b=businesses[id];if(!b){document.getElementById("name").textContent="Business not found";document.getElementById("description").textContent="Return to Businesses to browse profiles."}else{document.title=b.name+" | StuckLevel75";document.getElementById("name").textContent=b.name;document.getElementById("status").textContent=b.status;document.getElementById("description").textContent=b.description;document.getElementById("details").textContent=b.details;if(id==="seans-donuts")document.getElementById("hero").classList.add("past");for(const p of b.products){const e=document.createElement("div");e.className="product";e.textContent=p;document.getElementById("products").append(e)}}</script></body></html>
