<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Member Account | StuckLevel75</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#070b08;color:#f2fff3;font:16px Arial,sans-serif}main{max-width:680px;margin:30px auto;padding:20px}a{color:#00ff00}h1{color:#00ff00}form,.panel{background:#111a13;border:1px solid #2b4b31;border-radius:14px;padding:22px;margin:18px 0}label{display:block;margin:13px 0 5px}input,textarea{display:block;width:100%;padding:12px;background:#080f0a;color:#fff;border:1px solid #426149;border-radius:8px;font:inherit}button{background:#00ff00;color:#051005;border:0;border-radius:8px;padding:12px 18px;font-weight:bold;cursor:pointer;margin:12px 8px 0 0}.secondary{background:#27442e;color:white}.hidden{display:none!important}.hint{color:#b4c6b7;line-height:1.6}.error{color:#ff9999}#avatar-preview{width:96px;height:96px;object-fit:cover;border-radius:50%;border:2px solid #00ff00}#avatar-preview:not([src]){display:none}</style></head><body><main><a href="/">← Back to StuckLevel75</a><h1>Member Account</h1><p class="hint">Create an account or sign in. Your profile is private: only you and the site administrator can access it.</p><p id="status" role="status"></p>
<div id="guest"><form id="signup"><h2>Join StuckLevel75</h2><label>Username<input id="new-name" required minlength="2" maxlength="32"></label><label>Email<input id="new-email" type="email" required autocomplete="email"></label><label>Password<input id="new-password" type="password" minlength="6" required autocomplete="new-password"></label><button>Create Account</button></form>
<form id="signin"><h2>Sign In</h2><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign In</button><button class="secondary" type="button" id="reset-password">Reset Password</button></form></div>
<div id="member" class="hidden"><div class="panel"><h2>My Private Profile</h2><p id="email-display" class="hint"></p><p id="verification" class="hint"></p><button id="verify" type="button" class="secondary">Send Verification Email</button><button id="logout" type="button" class="secondary">Sign Out</button></div><form id="profile"><img id="avatar-preview" alt="Profile avatar"><label>Username<input id="username" minlength="2" maxlength="32" required></label><label>Bio<textarea id="bio" maxlength="500"></textarea></label><label>Avatar HTTPS URL<input id="avatar" type="url" maxlength="500" placeholder="https://example.com/avatar.png"></label><p class="hint">Paste a direct HTTPS image URL. Some hosts block embedding, and Discord links may expire.</p><button>Save Profile</button></form></div>
<script type="module" src="/member/member.js"></script></main></body></html>
